<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浙江树人学院数字孪生交互系统 · v0.7</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>

  <!-- ===== 加载遮罩 ===== -->
  <div class="loader" id="loader">
    <div class="loader-text">校园场景加载中</div>
  </div>

  <!-- ===== 3D 渲染画布 ===== -->
  <canvas id="scene"></canvas>

  <!-- ===== FPS ===== -->
  <div class="fps glass" id="fps">FPS --</div>

  <!-- ===== 顶部标题 ===== -->
  <div class="topbar glass">
    <h1>浙江树人学院 <span class="accent">数字孪生</span> 交互系统</h1>
    <span class="version">v0.7</span>
  </div>

  <!-- ===== 左侧控制面板 ===== -->
  <div class="panel-left glass">

    <h2>图层控制</h2>
    <div class="row"><label for="layer-ground">地面</label>
      <input class="switch" type="checkbox" id="layer-ground" data-layer="ground" checked></div>
    <div class="row"><label for="layer-roads">道路</label>
      <input class="switch" type="checkbox" id="layer-roads" data-layer="roads" checked></div>
    <div class="row"><label for="layer-buildings">建筑</label>
      <input class="switch" type="checkbox" id="layer-buildings" data-layer="buildings" checked></div>
    <div class="row"><label for="layer-vegetation">植被</label>
      <input class="switch" type="checkbox" id="layer-vegetation" data-layer="vegetation" checked></div>
    <div class="row"><label for="layer-facilities">设施</label>
      <input class="switch" type="checkbox" id="layer-facilities" data-layer="facilities" checked></div>
    <div class="row"><label for="layer-aiModels">AI 模型</label>
      <input class="switch" type="checkbox" id="layer-aiModels" data-layer="aiModels" checked></div>
    <div class="row"><label for="toggle-labels">建筑标签</label>
      <input class="switch" type="checkbox" id="toggle-labels"></div>

    <h2>视角</h2>
    <div class="btn-group">
      <button class="btn active" id="view-persp">透视</button>
      <button class="btn" id="view-top">鸟瞰</button>
      <button class="btn" id="view-tour">观光</button>
    </div>
    <div class="btn-group" style="margin-top:8px">
      <button class="btn" id="view-roam">自由漫游</button>
      <button class="btn" id="reset-btn">重置</button>
    </div>

    <h2>时间</h2>
    <div class="time-row">
      <div class="row">
        <span>当前</span>
        <span class="time-display" id="time-display">12:00</span>
      </div>
      <input type="range" id="time-slider" min="0" max="24" step="0.1" value="12">
    </div>

  </div>

  <!-- ===== 信息卡片 ===== -->
  <div class="info-card glass" id="info-card">
    <button class="close" id="info-close">×</button>
    <h3 id="info-name">建筑名称</h3>
    <span class="tag" id="info-tag">类型</span>
    <p id="info-desc">建筑描述</p>
  </div>

  <!-- ===== 自由漫游：准星 + 提示条（默认隐藏） ===== -->
  <div id="roam-crosshair">+</div>
  <div id="roam-hint" class="glass">
    <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 移动 ·
    <span class="key">Shift</span> 加速 ·
    <span class="key">鼠标</span> 转头 ·
    <span class="key">Esc</span> 退出
  </div>

  <!-- ===== 小地图 ===== -->
  <div class="minimap glass">
    <span class="label">拱宸桥校区</span>
    <canvas id="minimap-canvas"></canvas>
  </div>

  <!-- ===== 底部操作提示 ===== -->
  <div class="hints glass">
    <span class="key">左键</span> 旋转 ·
    <span class="key">右键</span> 平移 ·
    <span class="key">滚轮</span> 缩放 ·
    <span class="key">点击</span> 查看信息 ·
    <span class="key">G</span> 草坪 ·
    <span class="key">B</span> 建筑 ·
    <span class="key">R</span> 道路
  </div>

  <!-- ===== Three.js（本地，全局变量版） ===== -->
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
  <!-- ===== Bloom 后处理（按顺序加载） ===== -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <!-- ===== 存档数据（location.js 存在则覆盖默认数据，不存在则忽略） ===== -->
  <script src="./data/location.js" onerror="window.LOCATION_DATA=null"></script>
  <!-- ===== GLB 模型缓存（tools/build_glb_cache.bat 生成，file:// 也能加载） ===== -->
  <script src="./data/glb_cache.js" onerror="window.GLB_CACHE={}"></script>

  <!-- ===== 业务脚本（按依赖顺序加载） ===== -->
  <script src="./js/core.js"></script>
  <script src="./js/timeOfDay.js"></script>
  <script src="./js/sky.js"></script>
  <script src="./js/terrain.js"></script>
  <script src="./js/sports.js"></script>
  <script src="./js/buildings.js"></script>
  <script src="./js/vegetation.js"></script>
  <script src="./js/labels.js"></script>
  <script src="./js/bloom.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/tour.js"></script>
  <script src="./js/freeRoam.js"></script>
  <script src="./js/greenEditor.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="./js/buildingEditor.js"></script>
  <script src="./js/roadEditor.js"></script>
  <script src="./js/minimap.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
