<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浙江树人学院数字孪生交互系统 · v0.1</title>
  <style>
    /* ===== 全局重置 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      color: #e6f0fa;
      background: #050b14;
    }
    canvas { display: block; }

    /* ===== 深色玻璃拟态基底 ===== */
    .glass {
      background: rgba(12, 22, 36, 0.55);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(120, 200, 255, 0.18);
      box-shadow: 0 8px 32px rgba(0, 10, 25, 0.45);
      border-radius: 12px;
    }

    /* ===== 顶部标题栏 ===== */
    .topbar {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      padding: 10px 22px;
      display: flex; align-items: center; gap: 14px;
      z-index: 10;
    }
    .topbar h1 {
      font-size: 16px; font-weight: 500; letter-spacing: 1px;
      color: #cfe8ff;
    }
    .topbar .accent { color: #78c8ff; font-weight: 600; }
    .topbar .version {
      font-size: 12px; color: #78c8ff;
      padding: 2px 8px; border: 1px solid #78c8ff44; border-radius: 10px;
    }

    /* ===== 左侧控制面板 ===== */
    .panel-left {
      position: fixed; top: 80px; left: 16px; width: 240px;
      padding: 14px 16px; z-index: 10;
    }
    .panel-left h2 {
      font-size: 13px; font-weight: 500; color: #78c8ff;
      margin: 14px 0 8px; letter-spacing: 1px;
      text-transform: uppercase;
    }
    .panel-left h2:first-child { margin-top: 0; }
    .panel-left .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0; font-size: 13px;
    }
    .panel-left label { cursor: pointer; user-select: none; }

    /* ===== 自定义开关 ===== */
    .switch {
      position: relative; width: 36px; height: 18px;
      appearance: none; -webkit-appearance: none;
      background: rgba(255,255,255,0.1); border-radius: 9px;
      cursor: pointer; transition: background .2s;
      outline: none;
    }
    .switch::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #b9d4ec; transition: left .2s, background .2s;
    }
    .switch:checked { background: #78c8ff66; }
    .switch:checked::after { left: 20px; background: #78c8ff; }

    /* ===== 按钮组 ===== */
    .btn-group { display: flex; gap: 6px; margin-top: 6px; }
    .btn {
      flex: 1; padding: 8px 0; font-size: 12px;
      color: #cfe8ff; background: rgba(120,200,255,0.08);
      border: 1px solid rgba(120,200,255,0.2); border-radius: 8px;
      cursor: pointer; transition: all .15s;
      font-family: inherit;
    }
    .btn:hover { background: rgba(120,200,255,0.18); color: #fff; }
    .btn.active {
      background: #78c8ff; color: #051628; font-weight: 600;
      border-color: #78c8ff;
    }

    /* ===== 时间滑块 ===== */
    .time-row { margin-top: 10px; }
    .time-row .time-display {
      font-size: 14px; color: #78c8ff; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%; margin-top: 8px;
      -webkit-appearance: none; appearance: none;
      background: transparent; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px; background: rgba(120,200,255,0.2); border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; margin-top: -5px;
      background: #78c8ff; border-radius: 50%;
      box-shadow: 0 0 8px #78c8ff88;
    }

    /* ===== 信息卡片（点击建筑时显示） ===== */
    .info-card {
      position: fixed; top: 80px; right: 16px; width: 280px;
      padding: 18px 20px; z-index: 10;
      display: none;
    }
    .info-card.show { display: block; animation: slideIn .25s ease; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .info-card .close {
      position: absolute; top: 10px; right: 12px;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: none;
      color: #cfe8ff; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .info-card .close:hover { background: rgba(255,80,80,0.3); }
    .info-card h3 {
      font-size: 16px; color: #78c8ff;
      margin-bottom: 4px; padding-right: 24px;
    }
    .info-card .tag {
      display: inline-block; padding: 2px 8px; margin-bottom: 10px;
      font-size: 11px; color: #78c8ff;
      background: rgba(120,200,255,0.12);
      border: 1px solid rgba(120,200,255,0.3); border-radius: 10px;
    }
    .info-card p { font-size: 13px; line-height: 1.6; color: #c8d8e8; }

    /* ===== 小地图 ===== */
    .minimap {
      position: fixed; bottom: 16px; right: 16px;
      width: 180px; height: 180px;
      padding: 8px; z-index: 10;
    }
    .minimap canvas {
      width: 100%; height: 100%; border-radius: 6px;
      background: rgba(0,0,0,0.3);
    }
    .minimap .label {
      position: absolute; top: 12px; left: 14px;
      font-size: 11px; color: #78c8ff; letter-spacing: 1px;
    }

    /* ===== 底部操作提示 ===== */
    .hints {
      position: fixed; bottom: 16px; left: 16px;
      padding: 10px 16px; font-size: 12px; color: #a8c2dc;
      z-index: 10; line-height: 1.7;
    }
    .hints .key {
      display: inline-block; padding: 1px 6px;
      background: rgba(120,200,255,0.15);
      border: 1px solid rgba(120,200,255,0.3); border-radius: 4px;
      color: #78c8ff; font-family: monospace; font-size: 11px;
    }

    /* ===== FPS 显示 ===== */
    .fps {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      padding: 6px 12px; font-size: 12px; color: #78c8ff;
      font-family: monospace;
    }

    /* ===== 加载遮罩 ===== */
    .loader {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: #050b14; transition: opacity .4s;
    }
    .loader.hide { opacity: 0; pointer-events: none; }
    .loader-text { color: #78c8ff; font-size: 14px; letter-spacing: 2px; }
    .loader-text::after {
      content: ''; display: inline-block; width: 0;
      animation: dots 1.4s infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
  </style>
</head>
<body>

  <!-- ===== 加载遮罩 ===== -->
  <div class="loader" id="loader">
    <div class="loader-text">校园场景加载中</div>
  </div>

  <!-- ===== 3D 渲染画布 ===== -->
  <canvas id="scene"></canvas>

  <!-- ===== FPS ===== -->
  <div class="fps glass" id="fps">FPS --</div>

  <!-- ===== 顶部标题 ===== -->
  <div class="topbar glass">
    <h1>浙江树人学院 <span class="accent">数字孪生</span> 交互系统</h1>
    <span class="version">v0.1</span>
  </div>

  <!-- ===== 左侧控制面板 ===== -->
  <div class="panel-left glass">

    <h2>图层控制</h2>
    <div class="row"><label for="layer-ground">地面</label>
      <input class="switch" type="checkbox" id="layer-ground" data-layer="ground" checked></div>
    <div class="row"><label for="layer-roads">道路</label>
      <input class="switch" type="checkbox" id="layer-roads" data-layer="roads" checked></div>
    <div class="row"><label for="layer-buildings">建筑</label>
      <input class="switch" type="checkbox" id="layer-buildings" data-layer="buildings" checked></div>
    <div class="row"><label for="layer-vegetation">植被</label>
      <input class="switch" type="checkbox" id="layer-vegetation" data-layer="vegetation" checked></div>
    <div class="row"><label for="layer-facilities">设施</label>
      <input class="switch" type="checkbox" id="layer-facilities" data-layer="facilities" checked></div>
    <div class="row"><label for="layer-aiModels">AI 模型</label>
      <input class="switch" type="checkbox" id="layer-aiModels" data-layer="aiModels" checked></div>

    <h2>视角</h2>
    <div class="btn-group">
      <button class="btn active" id="view-persp">透视</button>
      <button class="btn" id="view-top">鸟瞰</button>
      <button class="btn" id="view-tour">漫游</button>
    </div>
    <div class="btn-group" style="margin-top:8px">
      <button class="btn" id="reset-btn">重置视角</button>
    </div>

    <h2>时间</h2>
    <div class="time-row">
      <div class="row">
        <span>当前</span>
        <span class="time-display" id="time-display">12:00</span>
      </div>
      <input type="range" id="time-slider" min="0" max="24" step="0.1" value="12">
    </div>

  </div>

  <!-- ===== 信息卡片 ===== -->
  <div class="info-card glass" id="info-card">
    <button class="close" id="info-close">×</button>
    <h3 id="info-name">建筑名称</h3>
    <span class="tag" id="info-tag">类型</span>
    <p id="info-desc">建筑描述</p>
  </div>

  <!-- ===== 小地图 ===== -->
  <div class="minimap glass">
    <span class="label">小地图</span>
    <canvas id="minimap-canvas"></canvas>
  </div>

  <!-- ===== 底部操作提示 ===== -->
  <div class="hints glass">
    <span class="key">左键</span> 旋转 ·
    <span class="key">右键</span> 平移 ·
    <span class="key">滚轮</span> 缩放 ·
    <span class="key">点击</span> 查看信息
  </div>

  <!-- ===== Three.js（本地） ===== -->
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>

  <script>
  /* ============================================================
     浙江树人学院数字孪生交互系统
     v0.1 - 项目骨架 + 占位场景
     坐标系：1 unit ≈ 1 m  |  原点 = 贺田图书馆  |  北 = -Z，东 = +X
     ============================================================ */

  // ===== 全局状态 =====
  let scene, camera, renderer, controls;
  let raycaster, pointer;
  const interactables = [];          // 所有可点击对象
  const layerGroups = {              // 图层分组（按 CAMPUS_DATA.md 第 5 节）
    ground:     new THREE.Group(),
    roads:      new THREE.Group(),
    buildings:  new THREE.Group(),
    vegetation: new THREE.Group(),
    facilities: new THREE.Group(),
    aiModels:   new THREE.Group()
  };
  let sun, ambient;                  // 主光源、环境光
  let minimapCtx, minimapCanvas;     // 小地图
  let lastFrame = performance.now();
  let frameCount = 0, fpsTimer = 0;
  let currentView = 'persp';         // 'persp' | 'top' | 'tour'

  // ===== 场景初始化 =====
  function initScene() {
    // 场景 + 雾
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 400, 1200);

    // 相机（透视）
    const aspect = window.innerWidth / window.innerHeight;
    camera = new THREE.PerspectiveCamera(55, aspect, 0.1, 2000);
    camera.position.set(260, 200, 260);
    camera.lookAt(0, 0, 0);

    // 渲染器
    renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('scene'),
      antialias: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;

    // OrbitControls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 20;
    controls.maxDistance = 600;
    controls.maxPolarAngle = Math.PI * 0.48;   // 不允许低于地平线
    controls.target.set(0, 0, 0);

    // 光照
    ambient = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambient);

    sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(150, 220, 100);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left   = -500;
    sun.shadow.camera.right  =  500;
    sun.shadow.camera.top    =  500;
    sun.shadow.camera.bottom = -500;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far  = 800;
    scene.add(sun);

    // 图层组挂到场景
    Object.values(layerGroups).forEach(g => scene.add(g));

    // Raycaster
    raycaster = new THREE.Raycaster();
    pointer = new THREE.Vector2();
  }

  // ===== 地坪 + 校园边界 =====
  function createGround() {
    // 主体地坪：1000 × 700 浅灰绿（覆盖整个 900×650 校园再留余量）
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(1000, 700),
      new THREE.MeshStandardMaterial({ color: 0x9ab089, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    layerGroups.ground.add(ground);

    // 校园边界框：900×650，浅蓝细线
    const boundary = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(900, 0.1, 650)),
      new THREE.LineBasicMaterial({ color: 0x78c8ff, transparent: true, opacity: 0.35 })
    );
    boundary.position.y = 0.2;
    layerGroups.ground.add(boundary);
  }

  // ===== 路网（10 条） =====
  // 数据与 CAMPUS_DATA.md 第 3 节同步；前 8 条来自原数据，后 2 条 v0.2 新增
  const ROAD_DATA = [
    { name: '南侧主路（沈半路/树人街）', points: [[-430, 250], [-160, 245], [80, 235], [320, 230]], width: 10 },
    { name: '东侧湖州街',               points: [[390, -260], [380, -100], [365, 80], [355, 230]], width: 12 },
    { name: '北侧学院路',               points: [[-280, -280], [-40, -270], [180, -265], [370, -250]], width: 10 },
    { name: '中央东西主路',             points: [[-230, 0], [-80, 5], [40, 0], [170, -5], [300, 0]], width: 7 },
    { name: '南门中轴路',               points: [[-40, 230], [-35, 170], [-20, 110], [0, 35]], width: 6 },
    { name: '东部运动区环路',           points: [[150, -90], [310, -90], [330, 40], [280, 120], [180, 90], [150, -20]], width: 6 },
    { name: '西部教学区支路',           points: [[-210, -140], [-180, -60], [-120, -25], [-60, -10]], width: 5 },
    { name: '行政生活区支路',           points: [[110, 40], [140, 120], [220, 170], [285, 170]], width: 5 },
    { name: '体育馆-操场连接小路',      points: [[290, -100], [305, -75], [315, -50], [315, -28]], width: 3 },
    { name: '球场-宿舍通路',            points: [[210, -80], [240, -100], [290, -115], [345, -120], [380, -170]], width: 5 }
  ];

  function createRoads() {
    const mat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.92 });

    ROAD_DATA.forEach(road => {
      const group = new THREE.Group();

      // 每对相邻关键点：扁平 Box 段 + 端点圆盘衔接
      for (let i = 0; i < road.points.length - 1; i++) {
        const [x1, z1] = road.points[i];
        const [x2, z2] = road.points[i + 1];
        const dx = x2 - x1, dz = z2 - z1;
        const len = Math.hypot(dx, dz);

        const seg = new THREE.Mesh(
          new THREE.BoxGeometry(len, 0.04, road.width),
          mat
        );
        seg.position.set((x1 + x2) / 2, 0.02, (z1 + z2) / 2);
        seg.rotation.y = -Math.atan2(dz, dx);
        seg.receiveShadow = true;
        group.add(seg);

        // 拐角圆盘（避免折线段断开缝隙）
        if (i > 0) {
          const join = new THREE.Mesh(
            new THREE.CylinderGeometry(road.width / 2, road.width / 2, 0.04, 16),
            mat
          );
          join.position.set(x1, 0.02, z1);
          join.receiveShadow = true;
          group.add(join);
        }
      }

      group.userData = {
        name: road.name,
        type: '道路',
        desc: `${road.name}，路宽 ${road.width} m。`,
        points: road.points,   // 小地图绘制要用
        width: road.width
      };
      layerGroups.roads.add(group);
      interactables.push(group);
    });
  }

  // ===== 操场（椭圆跑道 + 内场） =====
  function createTrack() {
    const group = new THREE.Group();
    const cx = 315, cz = -25;

    // 红色塑胶跑道：椭圆环（外 60×40，内 50×30）
    const trackShape = new THREE.Shape();
    trackShape.absellipse(0, 0, 60, 40, 0, Math.PI * 2, false, 0);
    const hole = new THREE.Path();
    hole.absellipse(0, 0, 50, 30, 0, Math.PI * 2, true, 0);
    trackShape.holes.push(hole);
    const trackGeo = new THREE.ExtrudeGeometry(trackShape, { depth: 0.04, bevelEnabled: false });
    trackGeo.rotateX(-Math.PI / 2);
    const track = new THREE.Mesh(
      trackGeo,
      new THREE.MeshStandardMaterial({ color: 0xc94d3a, roughness: 0.85 })
    );
    track.position.set(cx, 0.03, cz);
    track.receiveShadow = true;
    group.add(track);

    // 内场草坪（足球场）：椭圆 50×30
    const fieldShape = new THREE.Shape();
    fieldShape.absellipse(0, 0, 50, 30, 0, Math.PI * 2);
    const fieldGeo = new THREE.ShapeGeometry(fieldShape);
    fieldGeo.rotateX(-Math.PI / 2);
    const field = new THREE.Mesh(
      fieldGeo,
      new THREE.MeshStandardMaterial({ color: 0x4a7a3a, roughness: 0.95 })
    );
    field.position.set(cx, 0.035, cz);
    field.receiveShadow = true;
    group.add(field);

    group.userData = {
      name: '操场',
      type: '运动设施',
      desc: '标准椭圆塑胶跑道（外 120×80 m），内场为足球草坪。东北运动区核心。'
    };
    interactables.push(group);
    layerGroups.facilities.add(group);
  }

  // ===== 主席台看台（操场西侧，朝东三级阶梯） =====
  function createGrandstand() {
    const group = new THREE.Group();
    const baseX = 243, baseZ = -25;
    const mat = new THREE.MeshStandardMaterial({ color: 0xb8b8b0, roughness: 0.85 });

    // 3 级阶梯：i=0 最东最低（贴近跑道），i=2 最西最高
    for (let i = 0; i < 3; i++) {
      const tier = new THREE.Mesh(
        new THREE.BoxGeometry(3, 1, 25),
        mat
      );
      tier.position.set(baseX + 4 - i * 3, 0.5 + i * 1.0, baseZ);
      tier.castShadow = true;
      tier.receiveShadow = true;
      group.add(tier);
    }

    group.userData = {
      name: '主席台看台',
      type: '运动设施',
      desc: '操场西侧的混凝土阶梯看台，三级阶梯朝东，正对跑道与内场。'
    };
    interactables.push(group);
    layerGroups.facilities.add(group);
  }

  // ===== 篮球场（×2） =====
  function createBasketballCourts() {
    const group = new THREE.Group();
    const positions = [[210, -95], [210, -75]];
    const courtMat = new THREE.MeshStandardMaterial({ color: 0x3a6f9a, roughness: 0.85 });
    const lineMat  = new THREE.LineBasicMaterial({ color: 0xffffff });

    positions.forEach(([cx, cz]) => {
      const court = new THREE.Mesh(new THREE.PlaneGeometry(28, 15), courtMat);
      court.rotation.x = -Math.PI / 2;
      court.position.set(cx, 0.025, cz);
      court.receiveShadow = true;
      group.add(court);

      const edge = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.PlaneGeometry(27, 14)),
        lineMat
      );
      edge.rotation.x = -Math.PI / 2;
      edge.position.set(cx, 0.03, cz);
      group.add(edge);
    });

    group.userData = {
      name: '篮球场',
      type: '运动设施',
      desc: '体育馆西侧的两块标准篮球场。'
    };
    interactables.push(group);
    layerGroups.facilities.add(group);
  }

  // ===== 小足球场（独立） =====
  function createFootballField() {
    const group = new THREE.Group();
    const cx = 170, cz = -85;
    const field = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 30),
      new THREE.MeshStandardMaterial({ color: 0x4a7a3a, roughness: 0.95 })
    );
    field.rotation.x = -Math.PI / 2;
    field.position.set(cx, 0.022, cz);
    field.receiveShadow = true;
    group.add(field);

    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.PlaneGeometry(50, 30)),
      new THREE.LineBasicMaterial({ color: 0xffffff })
    );
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(cx, 0.026, cz);
    group.add(edge);

    group.userData = {
      name: '小足球场',
      type: '运动设施',
      desc: '与篮球场连成的运动片区，校园内独立小型足球场。'
    };
    interactables.push(group);
    layerGroups.facilities.add(group);
  }

  // ===== 简易绿地（v0.4 再补树木） =====
  function createGreenAreas() {
    const mat = new THREE.MeshStandardMaterial({ color: 0x6a9a5a, roughness: 0.95 });
    const list = [
      { name: '中央广场草坪',   geom: new THREE.CircleGeometry(22, 32), x:   0, z:    5 },
      { name: '教学区中央绿地', geom: new THREE.PlaneGeometry(80, 40),   x: -90, z:   50 },
      { name: '南门花园',       geom: new THREE.PlaneGeometry(80, 30),   x: -30, z:  200 },
      { name: '行政区绿带',     geom: new THREE.PlaneGeometry(60, 30),   x: 170, z:   80 },
      { name: '东北外缘绿地',   geom: new THREE.PlaneGeometry(100, 60),  x: 340, z: -200 }
    ];
    list.forEach(({ name, geom, x, z }) => {
      const m = new THREE.Mesh(geom, mat);
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, 0.01, z);
      m.receiveShadow = true;
      m.userData = { name, type: '绿地', desc: '粗粒度绿化区，v0.4 将散布树木与花坛。' };
      layerGroups.vegetation.add(m);
      interactables.push(m);
    });
  }

  // ===== 交互：点击对象 =====
  function onPointerDown(e) {
    if (e.target.tagName !== 'CANVAS') return;       // 点击 UI 时不触发
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(interactables, true);
    if (hits.length === 0) return;

    // 找到最近命中的 userData（沿父级回溯）
    let obj = hits[0].object;
    while (obj && !obj.userData?.name) obj = obj.parent;
    if (!obj?.userData?.name) return;

    showInfoCard(obj.userData);
  }

  function showInfoCard({ name, type, desc }) {
    document.getElementById('info-name').textContent = name || '未知对象';
    document.getElementById('info-tag').textContent  = type || '建筑';
    document.getElementById('info-desc').textContent = desc || '暂无介绍';
    document.getElementById('info-card').classList.add('show');
  }

  function hideInfoCard() {
    document.getElementById('info-card').classList.remove('show');
  }

  // ===== UI 事件 =====
  function bindUI() {
    // 图层开关
    document.querySelectorAll('.switch[data-layer]').forEach(sw => {
      sw.addEventListener('change', e => {
        const key = e.target.dataset.layer;
        if (layerGroups[key]) layerGroups[key].visible = e.target.checked;
      });
    });

    // 视角按钮
    document.getElementById('view-persp').addEventListener('click', () => setView('persp'));
    document.getElementById('view-top').addEventListener('click',   () => setView('top'));
    document.getElementById('view-tour').addEventListener('click',  () => setView('tour'));
    document.getElementById('reset-btn').addEventListener('click',  () => setView('persp'));

    // 时间滑块（v0.1 仅显示数字，日夜效果在 v0.5 接入）
    document.getElementById('time-slider').addEventListener('input', e => {
      updateTimeDisplay(parseFloat(e.target.value));
    });

    // 信息卡关闭
    document.getElementById('info-close').addEventListener('click', hideInfoCard);

    // 点击场景
    renderer.domElement.addEventListener('pointerdown', onPointerDown);

    // 窗口缩放
    window.addEventListener('resize', onResize);
  }

  function setView(mode) {
    currentView = mode;
    ['persp', 'top', 'tour'].forEach(m => {
      document.getElementById('view-' + m).classList.toggle('active', m === mode);
    });

    if (mode === 'persp') {
      controls.enabled = true;
      animateCamera({ pos: [260, 200, 260], target: [0, 0, 0] });
    } else if (mode === 'top') {
      controls.enabled = true;
      animateCamera({ pos: [0, 480, 0.1], target: [0, 0, 0] });
    } else if (mode === 'tour') {
      // v0.6 实现真正的漫游，v0.1 暂时切到一个低空透视位
      controls.enabled = true;
      animateCamera({ pos: [-100, 30, 200], target: [0, 5, 0] });
    }
  }

  // 简单的相机平滑过渡
  function animateCamera({ pos, target }) {
    const fromPos = camera.position.clone();
    const fromTgt = controls.target.clone();
    const toPos = new THREE.Vector3(...pos);
    const toTgt = new THREE.Vector3(...target);
    const dur = 800, start = performance.now();

    function step(now) {
      const t = Math.min(1, (now - start) / dur);
      const k = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOut
      camera.position.lerpVectors(fromPos, toPos, k);
      controls.target.lerpVectors(fromTgt, toTgt, k);
      controls.update();
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function updateTimeDisplay(hour) {
    const h = Math.floor(hour);
    const m = Math.floor((hour - h) * 60);
    document.getElementById('time-display').textContent =
      String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // ===== 小地图 =====
  function initMinimap() {
    minimapCanvas = document.getElementById('minimap-canvas');
    const dpr = window.devicePixelRatio || 1;
    const size = 160;
    minimapCanvas.width = size * dpr;
    minimapCanvas.height = size * dpr;
    minimapCtx = minimapCanvas.getContext('2d');
    minimapCtx.scale(dpr, dpr);
  }

  function drawMinimap() {
    if (!minimapCtx) return;
    const W = 160, H = 160;
    // 世界 900 × 650 → 小地图 160 × 160（取较大边居中）
    const worldW = 900, worldH = 650;
    const scale = Math.min(W / worldW, H / worldH);
    const ox = W / 2, oz = H / 2;

    minimapCtx.clearRect(0, 0, W, H);

    // 校园边界
    minimapCtx.strokeStyle = 'rgba(120,200,255,0.35)';
    minimapCtx.lineWidth = 1;
    minimapCtx.strokeRect(ox - worldW * scale / 2, oz - worldH * scale / 2,
                          worldW * scale, worldH * scale);

    // 路网骨架（v0.2 起：从 group.userData.points 直接绘线）
    minimapCtx.strokeStyle = 'rgba(120,200,255,0.55)';
    minimapCtx.lineWidth = 1;
    layerGroups.roads.children.forEach(g => {
      const pts = g.userData?.points;
      if (!pts) return;
      minimapCtx.beginPath();
      pts.forEach(([x, z], i) => {
        const sx = ox + x * scale, sz = oz + z * scale;
        if (i === 0) minimapCtx.moveTo(sx, sz);
        else minimapCtx.lineTo(sx, sz);
      });
      minimapCtx.stroke();
    });

    // 建筑点（v0.3 起会有内容）
    layerGroups.buildings.children.forEach(m => {
      const x = ox + m.position.x * scale;
      const z = oz + m.position.z * scale;
      minimapCtx.fillStyle = '#78c8ff';
      minimapCtx.fillRect(x - 2, z - 2, 4, 4);
    });

    // 相机位置（红点 + 朝向）
    const cx = ox + camera.position.x * scale;
    const cz = oz + camera.position.z * scale;
    minimapCtx.fillStyle = '#ff7a59';
    minimapCtx.beginPath();
    minimapCtx.arc(cx, cz, 4, 0, Math.PI * 2);
    minimapCtx.fill();

    // 朝向线（指向 target）
    const tx = ox + controls.target.x * scale;
    const tz = oz + controls.target.z * scale;
    minimapCtx.strokeStyle = '#ff7a59';
    minimapCtx.beginPath();
    minimapCtx.moveTo(cx, cz);
    minimapCtx.lineTo(tx, tz);
    minimapCtx.stroke();
  }

  // ===== 主循环 =====
  function animate(now) {
    requestAnimationFrame(animate);

    const dt = (now - lastFrame) / 1000;
    lastFrame = now;

    // FPS
    frameCount++;
    fpsTimer += dt;
    if (fpsTimer >= 0.5) {
      const fps = Math.round(frameCount / fpsTimer);
      document.getElementById('fps').textContent = 'FPS ' + fps;
      frameCount = 0;
      fpsTimer = 0;
    }

    controls.update();
    drawMinimap();
    renderer.render(scene, camera);
  }

  // ===== 启动 =====
  function boot() {
    initScene();
    createGround();
    createRoads();
    createTrack();
    createGrandstand();
    createBasketballCourts();
    createFootballField();
    createGreenAreas();
    initMinimap();
    bindUI();
    updateTimeDisplay(12);
    requestAnimationFrame(animate);

    // 隐藏加载遮罩
    setTimeout(() => document.getElementById('loader').classList.add('hide'), 300);
  }

  boot();
  </script>
</body>
</html>
